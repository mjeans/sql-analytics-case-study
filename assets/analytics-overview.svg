<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SQL analytics case study overview</title>
  <desc id="desc">A dashboard-style summary of activation, retention, support resolution, and site anomaly results generated by the SQL case study.</desc>
  <rect width="1200" height="675" fill="#F8FAFC"/>
  <rect width="1200" height="92" fill="#0F172A"/>
  <text x="54" y="46" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="30" font-weight="700">SQL Analytics Case Study</text>
  <text x="54" y="73" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16">Activation, retention, support experience, and operational anomaly review</text>
  <g font-family="Arial, sans-serif">
    <g>
      <rect x="54" y="124" width="250" height="110" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="324" y="124" width="250" height="110" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="594" y="124" width="250" height="110" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="864" y="124" width="282" height="110" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
      <text x="78" y="154" fill="#64748B" font-size="14" font-weight="700" letter-spacing=".7">MEMBERS</text>
      <text x="78" y="201" fill="#0F172A" font-size="40" font-weight="700">480</text>
      <text x="348" y="154" fill="#64748B" font-size="14" font-weight="700" letter-spacing=".7">SITES</text>
      <text x="348" y="201" fill="#0F172A" font-size="40" font-weight="700">8</text>
      <text x="618" y="154" fill="#64748B" font-size="14" font-weight="700" letter-spacing=".7">REFERRAL ACTIVATION</text>
      <text x="618" y="201" fill="#047857" font-size="40" font-weight="700">65.5%</text>
      <text x="888" y="154" fill="#9A3412" font-size="14" font-weight="700" letter-spacing=".7">SUMMIT SEPTEMBER</text>
      <text x="888" y="201" fill="#C2410C" font-size="40" font-weight="700">−90.0%</text>
    </g>

    <rect x="54" y="260" width="678" height="350" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="82" y="300" fill="#0F172A" font-size="21" font-weight="700">45-day retention by support-resolution quartile</text>
    <text x="82" y="326" fill="#64748B" font-size="14">Synthetic members with support tickets · fastest to slowest resolution</text>
    <g stroke="#E2E8F0" stroke-width="1">
      <line x1="155" y1="360" x2="680" y2="360"/>
      <line x1="155" y1="410" x2="680" y2="410"/>
      <line x1="155" y1="460" x2="680" y2="460"/>
      <line x1="155" y1="510" x2="680" y2="510"/>
    </g>
    <g fill="#64748B" font-size="13">
      <text x="91" y="365">Fastest</text><text x="91" y="415">Q2</text><text x="91" y="465">Q3</text><text x="91" y="515">Slowest</text>
      <text x="151" y="551">0%</text><text x="278" y="551">20%</text><text x="408" y="551">40%</text><text x="538" y="551">60%</text><text x="665" y="551">80%</text>
    </g>
    <g>
      <rect x="155" y="343" width="438" height="26" rx="5" fill="#0F766E"/>
      <rect x="155" y="393" width="386" height="26" rx="5" fill="#14B8A6"/>
      <rect x="155" y="443" width="232" height="26" rx="5" fill="#F59E0B"/>
      <rect x="155" y="493" width="171" height="26" rx="5" fill="#EA580C"/>
      <text x="604" y="362" fill="#0F172A" font-size="15" font-weight="700">66.7%</text>
      <text x="552" y="412" fill="#0F172A" font-size="15" font-weight="700">58.8%</text>
      <text x="337" y="462" fill="#0F172A" font-size="15" font-weight="700">35.3%</text>
      <text x="337" y="512" fill="#0F172A" font-size="15" font-weight="700">26.0%</text>
    </g>

    <rect x="754" y="260" width="392" height="350" rx="16" fill="#0F172A"/>
    <text x="786" y="300" fill="#F8FAFC" font-size="21" font-weight="700">Decision signal</text>
    <text x="786" y="338" fill="#94A3B8" font-size="14" font-weight="700" letter-spacing=".8">ANOMALY FLAG</text>
    <text x="786" y="390" fill="#FFFFFF" font-size="28" font-weight="700">Summit activity fell</text>
    <text x="786" y="427" fill="#FB923C" font-size="42" font-weight="700">90%</text>
    <text x="876" y="427" fill="#FFFFFF" font-size="18">below its</text>
    <text x="786" y="454" fill="#FFFFFF" font-size="18">prior three-month average.</text>
    <line x1="786" y1="485" x2="1114" y2="485" stroke="#334155"/>
    <text x="786" y="523" fill="#5EEAD4" font-size="16" font-weight="700">Recommended follow-up</text>
    <text x="786" y="551" fill="#CBD5E1" font-size="15">Review operational context before</text>
    <text x="786" y="574" fill="#CBD5E1" font-size="15">treating the decline as performance failure.</text>
  </g>
</svg>
